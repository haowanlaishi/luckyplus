<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><title>千万梦想基金</title>
<style>
:root{--p:#e63946;--s:#1d3557;--bg:#f4f6f9;--red:linear-gradient(135deg,#ff4b4b,#d90429);--blue:linear-gradient(135deg,#4cc9f0,#0077b6);--orange:linear-gradient(135deg,#f9c74f,#f8961e);--qf:linear-gradient(135deg,#5c5c99,#2d2d6b);--qb:linear-gradient(135deg,#f2c46d,#d4a037);--g:#e0e0e0;--gold:#d4a037;--gl:#f9c74f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:#333;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:0 15px 100px 15px}
/* 顶部超强磨砂吸顶 */
.top-sticky-wrapper{position:sticky;top:0;z-index:1000;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;background:rgba(244,246,249,0.65);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);padding-top:calc(15px + env(safe-area-inset-top));padding-bottom:5px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.3)}
.header{text-align:center;margin-bottom:10px;width:100%}
.header h1{color:var(--s);font-size:22px}
.tabs{display:flex;background:rgba(255,255,255,0.6);border-radius:12px;padding:5px;box-shadow:0 2px 10px rgba(0,0,0,.05);width:100%;margin-bottom:5px;border:1px solid rgba(255,255,255,0.5)}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:bold;color:#666;border-radius:8px;cursor:pointer;transition:all .3s}
.tab.active{background:var(--s);color:#fff;box-shadow:0 2px 8px rgba(29,53,87,0.3)}
/* 单式/复式栏 */
.ab{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;width:100%;padding:5px 0;margin-bottom:5px}
.ms{display:flex;gap:6px;align-items:center}.mb{background:rgba(255,255,255,0.8);border:1px solid var(--g);padding:5px 14px;border-radius:20px;font-size:13px;color:#666;cursor:pointer;font-weight:bold;backdrop-filter:blur(10px)}.mb.active{border-color:var(--p);color:var(--p);background:rgba(255,240,240,0.9)}.dv{width:1px;height:20px;background:rgba(0,0,0,0.1);margin:0 6px}.hb{background:rgba(255,255,255,0.8);color:#333;border:1px solid rgba(0,0,0,0.05);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;margin-left:auto;backdrop-filter:blur(10px)}.hb.active{background:var(--s);color:#fff;border-color:transparent}.badge{background:var(--p);color:#fff;font-size:11px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%}.ap{display:none;align-items:center;gap:5px;background:transparent;border:none;padding:4px 4px;font-size:13px;font-weight:bold;color:#999;cursor:pointer;transition:all .2s;flex-shrink:0}.ap.show{display:inline-flex}.ap .c{width:16px;height:16px;border-radius:50%;border:2px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:transparent;flex-shrink:0;transition:all .2s}.ap.ck{color:var(--gold)}.ap.ck .c{border-color:var(--gold);color:var(--gold)}
/* 独立记录面板 */
.hp{display:none;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);width:100%;max-width:400px;border-radius:16px;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,.05);margin-bottom:15px;border:1px solid rgba(255,255,255,0.6);flex-direction:column;gap:12px;transition:height .3s}
.hp.show{display:flex;animation:sd .3s}@keyframes sd{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}.hh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:10px;flex-shrink:0;position:relative;gap:8px}.ht{font-size:14px;font-weight:bold;color:var(--s)}.ta{color:#d4a037;font-size:12px;font-weight:bold;background:#fffaf0;padding:2px 10px;border-radius:12px;border:1px solid #f6e0b5;white-space:nowrap;margin-left:auto}.ta span{font-size:13px;font-weight:900}.cp{display:none;align-items:center;background:transparent;border:none;padding:2px 4px;font-size:13px;font-weight:bold;color:var(--gold);cursor:pointer;transition:all .2s;flex-shrink:0;white-space:nowrap}.cp.show{display:inline-flex}.cp:active{transform:scale(.92)}.cb{font-size:13px;color:#999;background:none;border:none;cursor:pointer}.hl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.sc{position:relative;border-radius:8px;overflow:hidden;background:#ff4d4f;flex-shrink:0}.sa{position:absolute;right:0;top:0;bottom:0;width:70px;background:#ff4d4f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;z-index:1}.hi{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;padding:10px 6px;background:#fff;position:relative;align-items:center;transition:transform .3s cubic-bezier(.25,.8,.25,1);z-index:2;width:100%;touch-action:pan-y;flex-direction:column}.hi.swiped{transform:translateX(-70px)}.hi .ball{width:38px;height:38px;font-size:17px;flex-shrink:0}.rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}.vl{width:2px;height:24px;background:linear-gradient(to bottom,transparent,#ccc,transparent);margin:0 4px;border-radius:1px}.hi.ml{padding:12px 8px;display:block}.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 2px;width:100%;align-items:center}.mg .ball.front{justify-self:start}.mg .ball.back{justify-self:end}
/* 纯白大卡片与灰色内嵌预览框 */
.panel{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:15px;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;flex-direction:column;margin-bottom:20px}.panel.hidden{display:none}.rd{font-size:12px;color:#888;margin-bottom:15px;text-align:center}.ra{min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;padding:10px 12px;background:#f8f9fa;border-radius:10px;margin-bottom:15px;gap:8px;width:100%;overflow:hidden;border:none}
.bw{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}.bw.multi-layout{flex-direction:row;align-items:flex-start;justify-content:flex-start}.bw.multi-layout .fw,.bw.multi-layout .bw2{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;width:100%}.bw.multi-layout .bw2{justify-content:flex-end;margin-top:6px}
/* 号码球 + 小锁角标 */
.ball{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px;box-shadow:0 2px 5px rgba(0,0,0,.15);flex-shrink:0}
.ball.red{background:var(--red)}.ball.blue{background:var(--blue)}.ball.orange{background:var(--orange)}.ball.qf{background:var(--qf)}.ball.qb{background:var(--qb)}
.ball-lock{position:absolute;top:-2px;right:-2px;font-size:11px;color:#ffd700;text-shadow:0 0 2px #000;pointer-events:none;z-index:2;}

.qp{display:flex;gap:6px;justify-content:center;margin-bottom:15px;flex-wrap:wrap;align-items:center;min-height:64px;padding:10px 12px;background:#f8f9fa;border-radius:10px;border:none}.qg{display:flex;gap:6px;align-items:center}.qd{width:1px;height:20px;background:#ddd;margin:0 4px}.pb{position:relative;width:34px;height:34px;border-radius:50%;border:2px dashed var(--g);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#999;cursor:pointer;transition:all .2s;font-size:16px}.pb.active{border-color:var(--p);border-style:solid;background:#fff0f0;color:var(--p);transform:scale(1.1)}.pb.fqf{background:var(--qf);border:none;color:#fff}.pb.fqb{background:var(--qb);border:none;color:#fff}
.pb-lock{position:absolute;top:-2px;right:-2px;font-size:11px;color:#ffd700;text-shadow:0 0 2px #000;pointer-events:none;z-index:2;}

.pa{margin-bottom:15px}.ps{margin-bottom:15px;padding:10px;border-radius:12px;border:1px solid transparent;transition:all .3s}.ps.as{background:rgba(253,251,247,0.8);border-color:#f9c74f}.pt{font-size:13px;color:#555;margin-bottom:8px;font-weight:bold;text-align:center}.ng{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nb{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.8);border:1px solid var(--g);font-size:14px;color:#333;cursor:pointer;transition:all .1s}.nb:active{transform:scale(.9)}.nb.sel.red{background:var(--red);color:#fff;border:none;box-shadow:none}.nb.sel.blue{background:var(--blue);color:#fff;border:none;box-shadow:none}.nb.sel.orange{background:var(--orange);color:#fff;border:none;box-shadow:none}.nb.qf{border-color:#c0c0d9;color:#2d2d6b}.nb.qb{border-color:#e6d3a3;color:#b07d1a}
.nb-lock{position:absolute;top:-2px;right:-2px;font-size:10px;color:#ffd700;text-shadow:0 0 2px #000;pointer-events:none;z-index:2;}

.ng.qbg{grid-template-columns:repeat(5,1fr)}
/* 脱离卡片的悬浮按钮与滑动隐藏 */
.btns{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:12px;width:90%;max-width:380px;z-index:999;transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);}
.btns.hide-bar { transform: translate(-50%, 150%) !important; }
.btn{flex:1;border:none;border-radius:30px;padding:15px 0;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn.br{background:rgba(255,255,255,0.65);color:#333;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 20px rgba(0,0,0,0.06);border:1px solid rgba(255,255,255,0.4);}
.btn.bs{background:linear-gradient(135deg,#f4a261,#e76f51);color:#fff;box-shadow:0 6px 15px rgba(231,111,81,0.4);}
.btn:active{transform:scale(0.95);}
.et{text-align:center;color:#aaa;font-size:13px;padding:15px 0}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
@keyframes jelly-pop { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 70% { transform: scale(0.95); } 100% { transform: scale(1); } }
.nb.pop-anim { animation: jelly-pop 0.3s ease-in-out !important; }
</style></head>
<body>
<div class="top-sticky-wrapper">
  <div class="header"><h1>🎉 千万梦想基金</h1></div>
  <div class="tabs"><div class="tab active" data-type="ssq">双色球</div><div class="tab" data-type="dlt">大乐透</div><div class="tab" data-type="qxc">七星彩</div></div>
  <div class="ab"><div class="ms"><button class="mb active" data-mode="single">单式</button><button class="mb" data-mode="multi">复式</button></div><button class="ap" id="ap"><span class="c">✓</span><span>追加</span></button><div class="dv"></div><button class="hb" id="hb">记录 <span class="badge" id="badge">0</span></button></div>
</div>
<div class="hp" id="hp"><div class="hh"><div class="ht" id="ht">选号记录</div><button class="cp" id="cp">复制</button><div class="ta" id="ta" style="display:none;">总计 <span id="tv">0</span> 元</div><button class="cb" id="cb">清空</button></div><div class="hl" id="hl"></div></div>
<div class="panel" id="mp"><div class="rd" id="rd"></div><div class="ra" id="ra"></div><div class="qp" id="qp" style="display:none"></div><div class="pa" id="pa"></div></div>
<div class="btns" id="bottom-btns"><button class="btn br" id="rb">🎲 机选填满</button><button class="btn bs" id="cf">✅ 确认选号</button></div>
<div class="toast" id="toast">提示</div>
<script>
const LOT={
  ssq:{name:'双色球',desc:'红球(1-33)选6个，蓝球(1-16)选1个',groups:[
    {id:'red',name:'红球',count:6,maxMulti:20,min:1,max:33,colorClass:'red'},
    {id:'blue',name:'蓝球',count:1,maxMulti:16,min:1,max:16,colorClass:'blue'}
  ],base:2},
  dlt:{name:'大乐透',desc:'前区(1-35)选5个，后区(1-12)选2个',groups:[
    {id:'red',name:'前区',count:5,maxMulti:35,min:1,max:35,colorClass:'blue'},
    {id:'blue',name:'后区',count:2,maxMulti:12,min:1,max:12,colorClass:'orange'}
  ],base:2,appendBase:3},
  qxc:{name:'七星彩',desc:'前区6位(允许重复)，后区1位',groups:[
    {id:'orange',name:'前区',count:6,min:0,max:9,colorClass:'qf'},
    {id:'blue',name:'后区',count:1,min:0,max:14,colorClass:'qb'}
  ],base:2}
};

let state={
  type:'ssq',
  mode:'single',
  sel:{},
  locked:{},
  hasTriggerRandom:false,
  qxcLocked:[false,false,false,false,false,false,false],
  qxcActive:{group:'orange',pos:0},
  list:JSON.parse(localStorage.getItem('solo_lotto_v24')||'[]')
};

// ===== 新增：单复式独立快照缓存 =====
const modeCache = { ssq: 'single', dlt: 'single' };
const modeSelCache = {
  ssq: { single: { sel: {}, locked: {} }, multi: { sel: {}, locked: {} } },
  dlt: { single: { sel: {}, locked: {} }, multi: { sel: {}, locked: {} } }
};

const $=id=>document.getElementById(id);
const ra=$('ra'),qp=$('qp'),pa=$('pa'),rd=$('rd'),te=$('toast'),hp=$('hp'),hl=$('hl'),badge=$('badge'),hb=$('hb'),ht=$('ht'),mp=$('mp'),ta=$('ta'),tv=$('tv'),ap=$('ap'),cp=$('cp');

function initState(){
  state.sel={};
  state.locked={};
  state.hasTriggerRandom=false;
  state.qxcLocked=[false,false,false,false,false,false,false];
  LOT[state.type].groups.forEach(g=>{state.sel[g.id]=[]});
  if(state.type==='qxc'){
    state.sel['orange']=Array(6).fill(null);
    state.sel['blue']=[null];
    state.qxcActive={group:'orange',pos:0};
  }
}

function toast(m){
  te.innerText=m;te.style.opacity=1;
  setTimeout(()=>{te.style.opacity=0},2000);
}

function comb(n,k){
  if(k<0||k>n)return 0;
  let r=1;
  for(let i=1;i<=k;i++) r=r*(n-i+1)/i;
  return Math.round(r);
}

function calcBets(){
  const cfg=LOT[state.type];
  if(state.type==='qxc'){
    if(state.sel['orange'].includes(null)||state.sel['blue'][0]===null)return 0;
    return 1;
  }
  if(state.mode==='single'){
    for(const g of cfg.groups) if(state.sel[g.id].length!==g.count) return 0;
    return 1;
  }
  const f=state.sel[cfg.groups[0].id].length,b=state.sel[cfg.groups[1].id].length;
  if(f<cfg.groups[0].count||b<cfg.groups[1].count)return 0;
  return comb(f,cfg.groups[0].count)*comb(b,cfg.groups[1].count);
}

function pad2(n){return n<10?'0'+n:''+n;}

function createBall(num, colorClass, isLocked=false){
  const d=document.createElement('div');
  d.className='ball '+colorClass;
  d.innerText=pad2(num);
  if(isLocked && state.hasTriggerRandom){
    const lockEl = document.createElement('span');
    lockEl.className='ball-lock';
    lockEl.innerText='🔒';
    d.appendChild(lockEl);
  }
  return d;
}

function renderHeaderTip(cfg){
  rd.innerText=cfg.desc;
}

function renderNormalPreview(cfg){
  ra.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='bw';
  ra.appendChild(wrap);

  const isMulti=state.mode==='multi';
  const fg=cfg.groups[0], bg=cfg.groups[1];
  const fc=state.sel[fg.id].length;

  if(isMulti&&fc>=7){
    wrap.classList.add('multi-layout');
    const fw=document.createElement('div'); fw.className='fw';
    [...state.sel[fg.id]].sort((a,b)=>a-b).forEach(n=>{
      const lock = (state.locked[fg.id]||[]).includes(n);
      fw.appendChild(createBall(n,fg.colorClass,lock));
    });
    wrap.appendChild(fw);

    const bw2=document.createElement('div'); bw2.className='bw2';
    [...state.sel[bg.id]].sort((a,b)=>a-b).forEach(n=>{
      const lock = (state.locked[bg.id]||[]).includes(n);
      bw2.appendChild(createBall(n,bg.colorClass,lock));
    });
    wrap.appendChild(bw2);
  }else{
    cfg.groups.forEach((g,i)=>{
      [...state.sel[g.id]].sort((a,b)=>a-b).forEach(n=>{
        const lock = (state.locked[g.id]||[]).includes(n);
        wrap.appendChild(createBall(n,g.colorClass,lock));
      });
      if(i===0&&cfg.groups.length>1&&state.sel[cfg.groups[1].id].length>0){
        const s=document.createElement('div');
        s.className='vl'; s.style.height='20px'; s.style.background='#ccc';
        wrap.appendChild(s);
      }
    });
  }
}

function renderQxcPreview(){
  qp.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='bw';

  const og=document.createElement('div'); og.className='qg';
  state.sel['orange'].forEach((v,i)=>{
    const act=state.qxcActive.group==='orange'&&state.qxcActive.pos===i;
    const b=document.createElement('div');
    b.className='pb'+(act?' active':'')+(v!==null?' fqf':'');
    b.innerText=v!==null?v:'?';
    if(state.hasTriggerRandom && state.qxcLocked[i]){
      const lock = document.createElement('span');
      lock.className='pb-lock'; lock.innerText='🔒';
      b.appendChild(lock);
    }
        b.onclick=()=>{
      if(act&&v!==null){
        state.sel['orange'][i]=null;
        state.qxcLocked[i]=false;
      }else state.qxcActive={group:'orange',pos:i};
      render();
    };
    og.appendChild(b);
  });
  wrap.appendChild(og);

  const dv=document.createElement('div'); dv.className='qd'; wrap.appendChild(dv);

  const bg=document.createElement('div'); bg.className='qg';
  const v=state.sel['blue'][0];
  const act=state.qxcActive.group==='blue';
  const b=document.createElement('div');
  b.className='pb'+(act?' active':'')+(v!==null?' fqb':'');
  b.innerText=v!==null?(v<10?'0'+v:v):'?';
  if(state.hasTriggerRandom && state.qxcLocked[6]){
    const lock = document.createElement('span');
    lock.className='pb-lock'; lock.innerText='🔒';
    b.appendChild(lock);
  }
    b.onclick=()=>{
    if(act&&v!==null){
      state.sel['blue'][0]=null;
      state.qxcLocked[6]=false;
    }else state.qxcActive={group:'blue',pos:0};
    render();
  };
  bg.appendChild(b);
  wrap.appendChild(bg);
  qp.appendChild(wrap);
}

function renderPreviewArea(cfg){
  ra.innerHTML='';
  qp.innerHTML='';
  if(state.type==='qxc'){
    ra.style.display='none';
    qp.style.display='flex';
    renderQxcPreview();
  }else{
    qp.style.display='none';
    ra.style.display='flex';
    renderNormalPreview(cfg);
  }
}

function renderNormalSelectGrid(cfg){
  pa.innerHTML='';
  cfg.groups.forEach(g=>{
    const gd=document.createElement('div');
    gd.className='ps';
    gd.innerHTML='<div class="pt">'+g.name+' (至少 '+g.count+' 个)</div>';
    const grid=document.createElement('div'); grid.className='ng';
    for(let i=g.min;i<=g.max;i++){
      const b=document.createElement('div');
      b.className='nb '+g.colorClass;
      b.innerText=pad2(i);
      if(state.sel[g.id].includes(i)) b.classList.add('sel');
      if(state.hasTriggerRandom && (state.locked[g.id]||[]).includes(i)){
        const lock = document.createElement('span');
        lock.className='nb-lock'; lock.innerText='🔒';
        b.appendChild(lock);
      }
      b.onclick=()=>handleSelect(g,i);
      grid.appendChild(b);
    }
    gd.appendChild(grid);
    pa.appendChild(gd);
  });
}

function renderQxcSelectGrid(){
  pa.innerHTML='';
  const os=document.createElement('div');
  os.className='ps'+(state.qxcActive.group==='orange'?' as':'');
  os.innerHTML='<div class="pt">前区选择 (0-9)</div>';
  const og=document.createElement('div'); og.className='ng';
  for(let i=0;i<=9;i++){
    const b=document.createElement('div'); b.className='nb qf'; b.innerText=i;
    b.onclick=()=>{
      if(state.qxcActive.group!=='orange') state.qxcActive={group:'orange',pos:0};
      state.sel['orange'][state.qxcActive.pos]=i;
      state.qxcLocked[state.qxcActive.pos]=true;
      let ne=state.sel['orange'].indexOf(null);
      if(ne>-1) state.qxcActive.pos=ne;
      render();
    };
    og.appendChild(b);
  }
  os.appendChild(og); pa.appendChild(os);

  const bs=document.createElement('div');
  bs.className='ps'+(state.qxcActive.group==='blue'?' as':'');
  bs.innerHTML='<div class="pt">后区选择 (0-14)</div>';
  const bg2=document.createElement('div'); bg2.className='ng qbg';
  for(let i=0;i<=14;i++){
    const b=document.createElement('div'); b.className='nb qb'; b.innerText=pad2(i);
    b.onclick=()=>{
      state.qxcActive={group:'blue',pos:0};
      state.sel['blue'][0]=i;
      state.qxcLocked[6]=true;
      render();
    };
    bg2.appendChild(b);
  }
  bs.appendChild(bg2); pa.appendChild(bs);
}

function render(){
  const cfg=LOT[state.type];
  renderHeaderTip(cfg);
  renderPreviewArea(cfg);
  renderSelectPanel(cfg);
}

function renderSelectPanel(cfg){
  if(state.type==='qxc'){
    renderQxcSelectGrid();
  }else{
    renderNormalSelectGrid(cfg);
  }
}

function handleSelect(g,num){
  const cur=state.sel[g.id];
  const idx=cur.indexOf(num);
  if(idx>-1){
    cur.splice(idx,1);
    if(state.locked[g.id]){
      const lidx = state.locked[g.id].indexOf(num);
      if(lidx>-1) state.locked[g.id].splice(lidx,1);
    }
  }else{
    const limit=state.mode==='single'?g.count:g.maxMulti;
    if(cur.length>=limit){
      toast('最多只能选择 '+limit+' 个号码');
      return;
    }
    cur.push(num);
  }
  render();
  setTimeout(()=>{
    document.querySelectorAll('.ng').forEach(grid=>{
      const balls=grid.querySelectorAll('.nb');
      const prev=grid.previousElementSibling;
      const isRed = prev && (prev.innerText.includes('红球') || prev.innerText.includes('前区'));
      if(g.id==='red' && !isRed) return;
      if(g.id==='blue' && isRed) return;
      balls.forEach(el=>{
        if(el.innerText===(num<10?'0'+num:num.toString())){
          el.classList.remove('pop-anim');
          void el.offsetWidth;
          el.classList.add('pop-anim');
        }
      });
    });
  },10);
}

function randomFill(){
  const cfg=LOT[state.type];
  if(state.mode==='multi'){
    state.locked={};
    state.hasTriggerRandom=false;
    state.qxcLocked=[false,false,false,false,false,false,false];
    if(state.type==='qxc'){
      state.sel['orange']=Array.from({length:6},()=>Math.floor(Math.random()*10));
      state.sel['blue']=[Math.floor(Math.random()*15)];
      state.qxcActive={group:'orange',pos:0};
    }else{
      cfg.groups.forEach(g=>{
        state.sel[g.id]=[];
        const cnt=g.count;
        let pool=[];
        for(let i=g.min;i<=g.max;i++)pool.push(i);
        for(let i=0;i<cnt;i++){
          const ri=Math.floor(Math.random()*pool.length);
          state.sel[g.id].push(pool[ri]);
          pool.splice(ri,1);
        }
      });
    }
    render();
    return;
  }

  if(state.type==='qxc'){
    if(!state.hasTriggerRandom){
      for(let i=0;i<6;i++){
        if(state.sel['orange'][i]!==null) state.qxcLocked[i]=true;
      }
      if(state.sel['blue'][0]!==null) state.qxcLocked[6]=true;
      state.hasTriggerRandom=true;
    }
    const allLock = state.qxcLocked.every(b=>b===true);
    if(allLock){
      toast('所有号码已手动锁定，无需机选填充');
      render();
      return;
    }
    for(let i=0;i<6;i++){
      if(!state.qxcLocked[i]){
        state.sel['orange'][i]=Math.floor(Math.random()*10);
      }
    }
    if(!state.qxcLocked[6]){
      state.sel['blue'][0]=Math.floor(Math.random()*15);
    }
    render();
    return;
  }

  const g1 = cfg.groups[0];
  const g2 = cfg.groups[1];
  if(!state.locked[g1.id]) state.locked[g1.id]=[];
  if(!state.locked[g2.id]) state.locked[g2.id]=[];

  if(!state.hasTriggerRandom){
    state.locked[g1.id] = [...state.sel[g1.id]];
    state.locked[g2.id] = [...state.sel[g2.id]];
    state.hasTriggerRandom=true;
  }

  const g1AllLock = state.locked[g1.id].length >= g1.count;
  const g2AllLock = state.locked[g2.id].length >= g2.count;
  if(g1AllLock && g2AllLock){
    toast('所有号码已手动锁定，无需机选填充');
    render();
    return;
  }

  state.sel[g1.id] = [...state.locked[g1.id]];
  state.sel[g2.id] = [...state.locked[g2.id]];

  if(state.sel[g1.id].length < g1.count){
    let pool1=[];
    for(let i=g1.min;i<=g1.max;i++){
      if(!state.locked[g1.id].includes(i)) pool1.push(i);
    }
    const need1 = g1.count - state.sel[g1.id].length;
    for(let i=0;i<need1;i++){
      const ri = Math.floor(Math.random()*pool1.length);
      state.sel[g1.id].push(pool1[ri]);
      pool1.splice(ri,1);
    }
  }
  if(state.sel[g2.id].length < g2.count){
    let pool2=[];
    for(let i=g2.min;i<=g2.max;i++){
      if(!state.locked[g2.id].includes(i)) pool2.push(i);
    }
    const need2 = g2.count - state.sel[g2.id].length;
    for(let i=0;i<need2;i++){
      const ri = Math.floor(Math.random()*pool2.length);
      state.sel[g2.id].push(pool2[ri]);
      pool2.splice(ri,1);
    }
  }
  render();
}

function confirmSel(){
  const cfg=LOT[state.type];
  let ok=true;
  if(state.type==='qxc'){
    if(state.sel['orange'].includes(null)){toast('请填满前区6个位置');ok=false;}
    else if(state.sel['blue'][0]===null){toast('请选择后区号码');ok=false;}
  }else{
    for(const g of cfg.groups){
      if(state.sel[g.id].length<g.count){
        toast(g.name+' 至少需要选择 '+g.count+' 个号码');
        ok=false;
        break;
      }
    }
  }
  if(ok){
    const bets=calcBets();
    const price=cfg.base*bets;
    const rec={
      id:Date.now(),
      type:state.type,
      mode:state.mode,
      numbers:JSON.parse(JSON.stringify(state.sel)),
      betCount:bets,
      price:price,
      isAppend:false
    };
    state.list.push(rec);
    save();
    renderList();
    updateBadge();
    toast('🎉 保存成功！金额：'+price+'元');
  }
}

function updateBadge(){
  const d=state.list.filter(i=>i.type===state.type&&i.mode===state.mode);
  badge.innerText=d.length;
}

function updateAppendBtn(){
  if(state.type!=='dlt'||!hp.classList.contains('show')){
    ap.classList.remove('show');ap.classList.remove('ck');
    return;
  }
  ap.classList.add('show');
  const d=state.list.filter(i=>i.type==='dlt');
  const all=d.length>0&&d.every(i=>i.isAppend);
  ap.classList.toggle('ck',all);
}

function toggleAppend(){
  const d=state.list.filter(i=>i.type==='dlt');
  if(d.length===0){toast('暂无大乐透记录');return;}
  const all=d.every(i=>i.isAppend);
  const t=!all;
  state.list.forEach(i=>{
    if(i.type==='dlt'){
      i.isAppend=t;
      i.price=i.betCount*(t?LOT.dlt.appendBase:LOT.dlt.base);
    }
  });
  save();
  updateAppendBtn();
  renderList();
  toast(t?'已全部追加':'已取消追加');
}

function buildCopyText(){
  const d=state.list.filter(i=>i.type===state.type&&i.mode===state.mode);
  if(d.length===0)return null;
  const cfg=LOT[state.type];
  const head='你好，'+cfg.name+(state.mode==='multi'?'复式':'');
  const lines=d.map(item=>{
    if(item.type==='qxc'){
      const front=item.numbers['orange'].map(n=>n.toString()).join('  ');
      const back=item.numbers['blue'].map(n=>n.toString()).join('  ');
      return front+'  +  '+back;
    }else{
      const fg=cfg.groups[0],bg=cfg.groups[1];
      const front=[...item.numbers[fg.id]].sort((a,b)=>a-b).map(pad2).join('  ');
      const back=[...item.numbers[bg.id]].sort((a,b)=>a-b).map(pad2).join('  ');
      return front+'  +  '+back;
    }
  });
  return head+'\n'+lines.join('\n');
}

function fallbackCopy(text,done){
  const t=document.createElement('textarea');
  t.value=text;
  t.style.position='fixed';t.style.top='-9999px';t.style.opacity='0';
  document.body.appendChild(t);
  t.focus();t.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){ok=false;}
  document.body.removeChild(t);
  if(ok) done(); else toast('复制失败，请重试');
}

function copyRecords(){
  const text=buildCopyText();
  if(!text){toast('暂无记录');return;}
  const done=()=>toast('已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else{
    fallbackCopy(text,done);
  }
}

function renderList(){
  const d=state.list.filter(i=>i.type===state.type&&i.mode===state.mode);
  ht.innerText=LOT[state.type].name+'选号记录';
  updateBadge();
  updateAppendBtn();
  cp.classList.toggle('show',d.length>0);
  let total=0;
  d.forEach(i=>{if(i.price)total+=i.price;});
  if(total>0){ta.style.display='block';tv.innerText=total;}else{ta.style.display='none';}
  if(d.length===0){hl.innerHTML='<div class="et">暂无记录</div>';return;}
  hl.innerHTML='';
  d.forEach(item=>{
    const sc=document.createElement('div');sc.className='sc';
    const sa=document.createElement('div');sa.className='sa';sa.innerText='删除';
    sa.onclick=()=>delRec(item.id);
    const div=document.createElement('div');div.className='hi';
    let html='';
    if(item.type==='qxc'){
      html='<div class="rw">';
      item.numbers['orange'].forEach(n=>{html+='<div class="ball qf">'+n+'</div>';});
      html+='<div class="vl"></div>';
      item.numbers['blue'].forEach(n=>{html+='<div class="ball qb">'+(n<10?'0'+n:n)+'</div>';});
      html+='</div>';
    }else{
      const cfg=LOT[item.type],fg=cfg.groups[0],bg=cfg.groups[1];
      if(item.mode==='multi'){
        div.classList.add('ml');
        const fn=[...item.numbers[fg.id]].sort((a,b)=>a-b);
        const bn=[...item.numbers[bg.id]].sort((a,b)=>a-b);
        const perRow=7;
        const mkF=n=>'<div class="ball '+fg.colorClass+' front">'+pad2(n)+'</div>';
        const mkB=n=>'<div class="ball '+bg.colorClass+' back">'+pad2(n)+'</div>';
        const mkE=()=>'<div></div>';
        let items=[];
        if(fn.length>perRow){
          let fr=fn.slice(0,perRow),rf=fn.slice(perRow);
          items.push(...fr.map(mkF));
          if(rf.length+bn.length<=perRow){
            items.push(...rf.map(mkF));
            let e=perRow-rf.length-bn.length;
            for(let i=0;i<e;i++)items.push(mkE());
            items.push(...bn.map(mkB));
          }else{
            items.push(...rf.map(mkF));
            let e2=perRow-rf.length;
            for(let i=0;i<e2;i++)items.push(mkE());
            let e3=perRow-bn.length;
            for(let i=0;i<e3;i++)items.push(mkE());
            items.push(...bn.map(mkB));
          }
        }else{
          items.push(...fn.map(mkF));
          let e1=perRow-fn.length;
          for(let i=0;i<e1;i++)items.push(mkE());
          let e2=perRow-bn.length;
          for(let i=0;i<e2;i++)items.push(mkE());
          items.push(...bn.map(mkB));
        }
        html='<div class="mg">'+items.join('')+'</div>';
      }else{
        html='<div class="rw">';
        cfg.groups.forEach((g,i)=>{
          [...item.numbers[g.id]].sort((a,b)=>a-b).forEach(n=>{
            html+='<div class="ball '+g.colorClass+'">'+pad2(n)+'</div>';
          });
          if(i===0&&cfg.groups.length>1) html+='<div class="vl"></div>';
        });
        html+='</div>';
      }
    }
    div.innerHTML=html;
    bindSwipe(div);
    sc.appendChild(sa);
    sc.appendChild(div);
    hl.appendChild(sc);
  });
}

function bindSwipe(item){
  let sx=0,cx=0,sy=0,sw=false,dir=null;

  item.addEventListener('touchstart',e=>{
    document.querySelectorAll('.hi.swiped').forEach(el=>{if(el!==item)el.classList.remove('swiped');});
    sx=e.touches[0].clientX;
    sy=e.touches[0].clientY;
    sw=false;
    dir=null;
    item.style.transition='none';
  },{passive:true});

  item.addEventListener('touchmove',e=>{
    cx=e.touches[0].clientX;
    const dx=cx-sx;
    const dy=e.touches[0].clientY-sy;

    if(dir===null){
      if(Math.abs(dx)>6||Math.abs(dy)>6){
        dir=Math.abs(dx)>Math.abs(dy)?'h':'v';
      }
    }
    if(dir==='v'){
      return;
    }

    if(Math.abs(dx)>10)sw=true;
    if(item.classList.contains('swiped')){
      let t=-70+dx;
      if(t>0)t=0;if(t<-70)t=-70;
      item.style.transform='translateX('+t+'px)';
    }else if(dx<0){
      let t=dx; if(t<-70)t=-70;
      item.style.transform='translateX('+t+'px)';
    }
  },{passive:true});

  item.addEventListener('touchend',()=>{
    item.style.transition='transform .3s cubic-bezier(.25,.8,.25,1)';

    if(dir==='v'){
      item.style.transform='';
      dir=null;
      sw=false;
      return;
    }

    const dx=cx-sx;
    if(sw){
      if(item.classList.contains('swiped')){
        if(dx>30){item.classList.remove('swiped');item.style.transform='';}
        else item.style.transform='';
      }else{
        if(dx<-30) item.classList.add('swiped');
        else item.style.transform='';
      }
    }else item.style.transform='';

    setTimeout(()=>{sw=false;},50);
  });

  item.addEventListener('click',e=>{
    if(sw)e.stopPropagation();
    else if(item.classList.contains('swiped')){
      item.classList.remove('swiped');item.style.transform='';
    }
  });
}

window.delRec=id=>{
  state.list=state.list.filter(i=>i.id!==id);
  save();renderList();updateBadge();updateAppendBtn();
};

function save(){
  localStorage.setItem('solo_lotto_v24',JSON.stringify(state.list));
}

// ===== 问题1 & 2：记录收起修复 =====
hb.onclick=()=>{
  if(hp.classList.contains('show')){
    hp.classList.remove('show');hb.classList.remove('active');
    mp.classList.remove('hidden');
    document.getElementById('bottom-btns').style.display='flex';
    updateAppendBtn();

    // 仅 ssq/dlt：延迟两帧重绘预览区 + 回填选号区高亮
    if (state.type !== 'qxc') {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          renderPreviewArea(LOT[state.type]);
          renderNormalSelectGrid(LOT[state.type]);
        });
      });
    }
  }else{
    hp.classList.add('show');hb.classList.add('active');
    mp.classList.add('hidden');
    document.getElementById('bottom-btns').style.display='none';
    renderList();updateAppendBtn();
  }
};

// ===== 问题3：切换彩种保留模式偏好 =====
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    if (state.type === 'ssq' || state.type === 'dlt') {
      modeCache[state.type] = state.mode;
    }

    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    state.type = tab.dataset.type;

    if (state.type === 'qxc') {
      state.mode = 'single';
    } else {
      state.mode = modeCache[state.type] || 'single';
    }

    document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('active', b.dataset.mode === state.mode));

    initState();

    if (state.type !== 'qxc') {
      modeSelCache[state.type].single = { sel: {}, locked: {} };
      modeSelCache[state.type].multi = { sel: {}, locked: {} };
    }

    render(); renderList(); updateBadge();
    hp.classList.remove('show'); hb.classList.remove('active');
    mp.classList.remove('hidden');
    document.getElementById('bottom-btns').style.display='flex';
    updateAppendBtn();
  };
});

// ===== 问题4：单复式互切恢复快照 =====
document.querySelectorAll('.mb').forEach(btn=>{
  btn.onclick=()=>{
    if (state.type === 'qxc') { toast('七星彩暂无复式投注'); return; }

    const newMode = btn.dataset.mode;
    if (state.mode === newMode) return;

    const cfg = LOT[state.type];
    const oldMode = state.mode;

    modeSelCache[state.type][oldMode].sel = JSON.parse(JSON.stringify(state.sel));
    modeSelCache[state.type][oldMode].locked = JSON.parse(JSON.stringify(state.locked));

    state.mode = newMode;
    const target = modeSelCache[state.type][newMode];

    if (!target.sel || Object.keys(target.sel).length === 0) {
      state.sel = {};
      state.locked = {};
      cfg.groups.forEach(g=>{ state.sel[g.id] = []; });
    } else {
      state.sel = JSON.parse(JSON.stringify(target.sel));
      state.locked = JSON.parse(JSON.stringify(target.locked));
    }

    document.querySelectorAll('.mb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    render(); updateBadge();
    if (hp.classList.contains('show')) renderList();
  };
});

$('rb').onclick=randomFill;
$('cf').onclick=confirmSel;
cp.onclick=copyRecords;
$('cb').onclick=()=>{
  if(confirm('确定要清空所有【'+LOT[state.type].name+'】的选号记录吗？')){
    state.list=state.list.filter(i=>i.type!==state.type);
    save();renderList();updateBadge();updateAppendBtn();
  }
};
ap.onclick=toggleAppend;

let lastScrollTop = 0;
const bottomBtns = document.getElementById('bottom-btns');
window.addEventListener('scroll', () => {
  let st = window.pageYOffset || document.documentElement.scrollTop;
  if (st > lastScrollTop && st > 50) {
    bottomBtns.classList.add('hide-bar');
  } else {
    bottomBtns.classList.remove('hide-bar');
  }
  lastScrollTop = st <= 0 ? 0 : st;
}, {passive: true});

let scrollTimer;
window.addEventListener('touchmove', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    bottomBtns.classList.remove('hide-bar');
  }, 800);
}, {passive: true});

initState();
render();
updateBadge();
renderList();
updateAppendBtn();
</script>
